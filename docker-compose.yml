version: '3.8'\n\nservices:\n  mongodb:\n    image: mongo:6.0\n    container_name: globalpay_mongo\n    ports:\n      - '27017:27017'\n    environment:\n      MONGO_INITDB_ROOT_USERNAME: root\n      MONGO_INITDB_ROOT_PASSWORD: rootpassword\n    volumes:\n      - mongo_data:/data/db\n\n  redis:\n    image: redis:7-alpine\n    container_name: globalpay_redis\n    ports:\n      - '6379:6379'\n    volumes:\n      - redis_data:/data\n\n  backend:\n    image: node:18-alpine\n    container_name: globalpay_backend\n    ports:\n      - '5000:5000'\n    environment:\n      MONGODB_URI: mongodb://root:rootpassword@mongodb:27017/globalpay?authSource=admin\n      REDIS_URL: redis://redis:6379\n      JWT_SECRET: dev-secret-key\n      NODE_ENV: development\n      FRONTEND_URL: http://localhost:3000\n    depends_on:\n      - mongodb\n      - redis\n    volumes:\n      - ./backend/src:/app/src\n    working_dir: /app\n    command: sh -c \"npm install && npm run dev\"\n\n  frontend:\n    image: node:18-alpine\n    container_name: globalpay_frontend\n    ports:\n      - '3000:3000'\n    environment:\n      NEXT_PUBLIC_API_URL: http://localhost:5000/api\n    depends_on:\n      - backend\n    volumes:\n      - ./frontend:/app\n    working_dir: /app\n    command: sh -c \"npm install && npm run dev\"\n\nvolumes:\n  mongo_data:\n  redis_data:\n